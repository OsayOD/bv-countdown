<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BV 90-Day Countdown</title>

<style>

:root{
    --bg1:#0f172a;
    --bg2:#111827;
    --card:rgba(255,255,255,.08);
    --accent:#38bdf8;
    --accent2:#22d3ee;
    --text:#ffffff;
    --muted:#94a3b8;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,var(--bg1),var(--bg2));
    font-family:"Segoe UI",sans-serif;
    color:var(--text);
    overflow:hidden;
}

body::before{
    content:'';
    position:absolute;
    width:600px;
    height:600px;
    background:rgba(56,189,248,.15);
    filter:blur(150px);
    border-radius:50%;
    top:-150px;
    right:-150px;
}

.card{
    width:1000px;
    max-width:92%;
    padding:50px;
    border-radius:30px;
    background:var(--card);
    backdrop-filter:blur(25px);
    border:1px solid rgba(255,255,255,.08);
    box-shadow:0 30px 80px rgba(0,0,0,.4);
    text-align:center;
    position:relative;
    z-index:1;
}

.header{
    text-transform:uppercase;
    letter-spacing:3px;
    color:var(--muted);
    font-size:14px;
}

.big-number{
    font-size:130px;
    font-weight:700;
    line-height:1;
    margin-top:15px;

    background:linear-gradient(
        90deg,
        var(--accent),
        var(--accent2)
    );

    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.main-label{
    font-size:28px;
    margin-top:5px;
}

.timer-section{
    margin-top:25px;
}

.timer-title{
    color:var(--muted);
    font-size:12px;
    letter-spacing:2px;
    text-transform:uppercase;
    margin-bottom:10px;
}

.timer{
    font-size:40px;
    font-family:Consolas, monospace;
    font-weight:700;
    color:#67e8f9;
}

.progress-container{
    width:100%;
    height:24px;
    margin-top:35px;
    background:rgba(255,255,255,.08);
    border-radius:999px;
    overflow:hidden;
}

.progress-bar{
    height:100%;
    width:0%;
    background:linear-gradient(
        90deg,
        #3b82f6,
        #06b6d4
    );
    transition:width .75s ease;
}

.progress-text{
    margin-top:12px;
    color:#cbd5e1;
}

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:20px;
    margin-top:40px;
}

.stat{
    padding:24px;
    border-radius:20px;
    background:rgba(255,255,255,.05);
}

.stat-value{
    font-size:28px;
    font-weight:700;
    color:#7dd3fc;
}

.stat-label{
    margin-top:8px;
    font-size:12px;
    color:var(--muted);
    text-transform:uppercase;
    letter-spacing:1px;
}

.footer{
    margin-top:35px;
}

.message{
    font-size:22px;
    color:#67e8f9;
}

.clock{
    margin-top:10px;
    color:#94a3b8;
    font-size:14px;
}

@media(max-width:900px){

    .stats{
        grid-template-columns:repeat(2,1fr);
    }

    .big-number{
        font-size:85px;
    }

    .timer{
        font-size:28px;
    }
}

</style>
</head>
<body>

<div class="card">

    <div class="header">
        Black & Veatch • 90-Day Onboarding Tracker
    </div>

    <div id="daysRemaining" class="big-number">
        --
    </div>

    <div id="mainLabel" class="main-label">
        Days Until Hybrid Eligibility
    </div>

    <div class="timer-section">

        <div class="timer-title">
            Time Remaining
        </div>

        <div id="countdownTimer" class="timer">
            Loading...
        </div>

    </div>

    <div class="progress-container">
        <div id="progressBar" class="progress-bar"></div>
    </div>

    <div id="progressText" class="progress-text"></div>

    <div class="stats">

        <div class="stat">
            <div class="stat-value">
                Jun 1, 2026
            </div>
            <div class="stat-label">
                Start Date
            </div>
        </div>

        <div class="stat">
            <div id="daysServed" class="stat-value">
                --
            </div>
            <div class="stat-label">
                Days Served
            </div>
        </div>

        <div class="stat">
            <div id="daysLeft" class="stat-value">
                --
            </div>
            <div class="stat-label">
                Days Remaining
            </div>
        </div>

        <div class="stat">
            <div id="eligibilityDate" class="stat-value">
                --
            </div>
            <div class="stat-label">
                Hybrid Eligible
            </div>
        </div>

    </div>

    <div class="footer">

        <div id="message" class="message">
            Loading...
        </div>

        <div id="currentTime" class="clock">
        </div>

    </div>

</div>

<script>

const START_DATE = new Date('2026-06-01T00:00:00');
const TOTAL_DAYS = 90;

const RELEASE_DATE = new Date(START_DATE);
RELEASE_DATE.setDate(RELEASE_DATE.getDate() + TOTAL_DAYS);

function formatDate(date){

    return date.toLocaleDateString(
        'en-US',
        {
            month:'short',
            day:'numeric',
            year:'numeric'
        }
    );
}

document
    .getElementById('eligibilityDate')
    .textContent = formatDate(RELEASE_DATE);

function updateDashboard(){

    const now = new Date();

    const daysServed = Math.max(
        0,
        Math.floor(
            (now - START_DATE) /
            (1000*60*60*24)
        )
    );

    const daysRemaining = Math.max(
        0,
        Math.ceil(
            (RELEASE_DATE - now) /
            (1000*60*60*24)
        )
    );

    const percentComplete =
        Math.min(
            100,
            (daysServed / TOTAL_DAYS) * 100
        );

    document
        .getElementById('daysRemaining')
        .textContent = daysRemaining;

    document
        .getElementById('daysServed')
        .textContent = daysServed;

    document
        .getElementById('daysLeft')
        .textContent = daysRemaining;

    document
        .getElementById('progressBar')
        .style.width =
        percentComplete + "%";

    document
        .getElementById('progressText')
        .textContent =
        `Day ${Math.min(daysServed,TOTAL_DAYS)} of ${TOTAL_DAYS} • ${percentComplete.toFixed(1)}% Complete`;

    const diff = RELEASE_DATE - now;

    if(diff > 0){

        const d =
            Math.floor(diff / (1000*60*60*24));

        const h =
            Math.floor((diff/(1000*60*60)) % 24);

        const m =
            Math.floor((diff/(1000*60)) % 60);

        const s =
            Math.floor((diff/1000) % 60);

        document
            .getElementById('countdownTimer')
            .textContent =
            `${d}d ${h}h ${m}m ${s}s`;

    } else {

        document
            .getElementById('countdownTimer')
            .textContent =
            '00d 00h 00m 00s';

        document
            .getElementById('daysRemaining')
            .textContent =
            '🎉';

        document
            .getElementById('mainLabel')
            .textContent =
            'Hybrid Eligible';

    }

    if(daysRemaining <= 7){

        document
            .getElementById('message')
            .textContent =
            '🏁 Final week. The finish line is in sight.';

    }
    else if(daysRemaining <= 21){

        document
            .getElementById('message')
            .textContent =
            '🚀 Final stretch. Less than three weeks remaining.';

    }
    else{

        document
            .getElementById('message')
            .textContent =
            '📈 Consistent progress toward flex eligibility.';
    }

    document
        .getElementById('currentTime')
        .textContent =
        'Current Time: ' +
        now.toLocaleString();
}

updateDashboard();
setInterval(updateDashboard, 1000);

</script>

</body>
</html>
