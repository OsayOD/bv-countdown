<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BV 90-Day Countdown</title>

<style>

:root{
    --bg1:#0f172a;
    --bg2:#1e293b;
    --accent:#38bdf8;
    --accent2:#22d3ee;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(135deg,var(--bg1),var(--bg2));
    overflow:hidden;
}

.card{
    width:950px;
    max-width:90%;
    padding:50px;
    border-radius:30px;
    background:rgba(255,255,255,.08);
    backdrop-filter:blur(20px);
    border:1px solid rgba(255,255,255,.12);
    color:white;
    text-align:center;
    box-shadow:0 30px 60px rgba(0,0,0,.4);
}

.subtitle{
    color:#94a3b8;
    text-transform:uppercase;
    letter-spacing:3px;
    font-size:14px;
    margin-bottom:20px;
}

.days{
    font-size:130px;
    font-weight:700;
    line-height:1;
    background:linear-gradient(90deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.label{
    font-size:28px;
    margin-top:10px;
}

.progress-container{
    width:100%;
    height:24px;
    background:rgba(255,255,255,.08);
    border-radius:999px;
    margin-top:40px;
    overflow:hidden;
}

.progress{
    height:100%;
    width:0%;
    border-radius:999px;
    background:linear-gradient(90deg,#3b82f6,#06b6d4);
    transition:width 1s ease;
}

.percent{
    margin-top:15px;
    color:#cbd5e1;
}

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:20px;
    margin-top:40px;
}

.stat{
    padding:24px;
    border-radius:20px;
    background:rgba(255,255,255,.05);
}

.stat .value{
    font-size:32px;
    font-weight:700;
    color:#7dd3fc;
}

.stat .title{
    font-size:13px;
    margin-top:8px;
    color:#94a3b8;
    text-transform:uppercase;
    letter-spacing:1px;
}

.message{
    margin-top:35px;
    font-size:24px;
    color:#67e8f9;
    font-weight:500;
}

@media(max-width:768px){

    .stats{
        grid-template-columns:repeat(2,1fr);
    }

    .days{
        font-size:80px;
    }
}

</style>
</head>

<body>

<div class="card">

    <div class="subtitle">
        Black & Veatch 90-Day Onboarding
    </div>

    <div class="days" id="daysRemaining">--</div>

    <div class="label" id="mainLabel">
        Days Until Hybrid Eligibility
    </div>

    <div class="progress-container">
        <div class="progress" id="progressBar"></div>
    </div>

    <div class="percent" id="progressText"></div>

    <div class="stats">

        <div class="stat">
            <div class="value">Jun 1, 2026</div>
            <div class="title">Start Date</div>
        </div>

        <div class="stat">
            <div class="value" id="servedDays">--</div>
            <div class="title">Days Served</div>
        </div>

        <div class="stat">
            <div class="value" id="remainingDays">--</div>
            <div class="title">Days Remaining</div>
        </div>

        <div class="stat">
            <div class="value">Aug 31, 2026</div>
            <div class="title">Hybrid Eligible</div>
        </div>

    </div>

    <div class="message" id="motivationalText"></div>

</div>

<script>

const startDate = new Date('2026-06-01');
const totalDays = 90;

const today = new Date();
today.setHours(0,0,0,0);

const diffTime = today - startDate;
const daysServed = Math.max(0, Math.floor(diffTime / (1000 * 60 * 60 * 24)));

const daysRemaining = Math.max(0, totalDays - daysServed);

const percentComplete = Math.min(
    100,
    (daysServed / totalDays) * 100
);

document.getElementById('daysRemaining').textContent = daysRemaining;
document.getElementById('servedDays').textContent = daysServed;
document.getElementById('remainingDays').textContent = daysRemaining;

document.getElementById('progressBar').style.width =
    percentComplete + "%";

document.getElementById('progressText').textContent =
    `Day ${daysServed} of ${totalDays} • ${percentComplete.toFixed(1)}% Complete`;

if(daysRemaining <= 0){

    document.getElementById('daysRemaining').textContent = "🎉";
    document.getElementById('mainLabel').textContent = "Hybrid Eligible!";
    document.getElementById('motivationalText').textContent =
        "Congratulations. You've completed BV's 90-day onboarding requirement.";

}else if(daysRemaining <= 7){

    document.getElementById('motivationalText').textContent =
        "Final week. The finish line is in sight.";

}else if(daysRemaining <= 21){

    document.getElementById('motivationalText').textContent =
        "Final stretch. Less than three weeks remaining.";

}else{

    document.getElementById('motivationalText').textContent =
        "Making steady progress toward hybrid eligibility.";
}

</script>

</body>
</html>
