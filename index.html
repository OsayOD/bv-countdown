:root{

body{

    background:linear-gradient(135deg,var(--bg1),var(--bg2));
    font-family:"Segoe UI",sans-serif;
    color:var(--text);
    overflow:hidden;
}

body::before{

    position:absolute;
    width:600px;
    height:600px;
    background:rgba(56,189,248,.15);
    filter:blur(150px);
    border-radius:50%;
    top:-150px;
    right:-150px;
}

.card{
    width:1000px;
    max-width:92%;
    padding:50px;

    background:var(--card);

    box-shadow:0 30px 80px rgba(0,0,0,.4);
    text-align:center;
    position:relative;
    z-index:1;
}
